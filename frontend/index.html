<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用使用时间追踪 ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #1a0a2e 100%);
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 80%, rgba(147, 51, 234, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(236, 72, 153, 0.1) 0%, transparent 30%);
            pointer-events: none;
            z-index: 0;
        }

        .floating-stars {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }



        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-100px) rotate(180deg); opacity: 1; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid rgba(147, 51, 234, 0.3);
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #f472b6, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #c084fc;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            box-shadow: 0 0 10px #4ade80, 0 0 20px rgba(74, 222, 128, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #4ade80, 0 0 20px rgba(74, 222, 128, 0.5); }
            50% { opacity: 0.7; box-shadow: 0 0 15px #4ade80, 0 0 30px rgba(74, 222, 128, 0.7); }
        }

        .time-tabs {
            display: flex;
            gap: 12px;
            margin: 24px 0;
        }

        .time-tab {
            padding: 12px 28px;
            border: 2px solid transparent;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.2), rgba(59, 130, 246, 0.2));
            color: #c084fc;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .time-tab:hover {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.4), rgba(59, 130, 246, 0.4));
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(147, 51, 234, 0.3);
        }

        .time-tab.active {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
        }

        .date-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.15), rgba(59, 130, 246, 0.15));
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(147, 51, 234, 0.2);
        }

        .date-item {
            padding: 10px 18px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(147, 51, 234, 0.3));
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e7ff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .date-item:hover {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.5), rgba(99, 102, 241, 0.5));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(147, 51, 234, 0.3);
        }

        .date-item.active {
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: #fff;
            box-shadow: 0 5px 20px rgba(236, 72, 153, 0.4);
        }

        .date-item.has-data::after {
            content: '✨';
            margin-left: 8px;
            font-size: 12px;
        }

        .stats-card {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.2), rgba(59, 130, 246, 0.2));
            padding: 24px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(147, 51, 234, 0.3);
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.3);
        }

        .stat-label {
            font-size: 14px;
            color: #c084fc;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(90deg, #f472b6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-list {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.15), rgba(59, 130, 246, 0.15));
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(147, 51, 234, 0.2);
        }

        .app-item {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 16px;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid rgba(147, 51, 234, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .app-item:last-child {
            border-bottom: none;
        }

        .app-item:hover {
            background: linear-gradient(90deg, rgba(147, 51, 234, 0.2), rgba(59, 130, 246, 0.1));
            transform: translateX(10px);
        }

        .app-icon {
            width: 45px;
            height: 45px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .app-info {
            min-width: 0;
        }

        .app-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #f3e8ff;
        }

        .app-window {
            font-size: 13px;
            color: #a78bfa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-time {
            text-align: right;
            min-width: 110px;
        }

        .app-time-value {
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(90deg, #f472b6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-last-action {
            text-align: right;
            min-width: 160px;
            font-size: 13px;
            color: #c084fc;
        }

        .action-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .action-badge.open {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.3), rgba(34, 197, 94, 0.3));
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.5);
        }

        .action-badge.close {
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.3), rgba(239, 68, 68, 0.3));
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.5);
        }

        .action-badge.running {
            background: linear-gradient(135deg, rgba(147, 197, 253, 0.3), rgba(96, 165, 250, 0.3));
            color: #93c5fd;
            border: 1px solid rgba(147, 197, 253, 0.5);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #a78bfa;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a78bfa;
        }

        .empty-state-icon {
            font-size: 52px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 16px;
            color: #c084fc;
            margin-bottom: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .detail-view {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.2), rgba(59, 130, 246, 0.15));
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(147, 51, 234, 0.2);
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .detail-date {
            font-size: 19px;
            font-weight: 700;
            background: linear-gradient(90deg, #f472b6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            padding: 8px 20px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border: none;
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.5);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(147, 51, 234, 0.2);
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 10, 46, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.95), rgba(22, 33, 62, 0.95));
            border-radius: 24px;
            padding: 28px;
            width: 90%;
            max-width: 480px;
            max-height: 80vh;
            overflow-y: auto;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 20px 60px rgba(147, 51, 234, 0.4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #f472b6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border: none;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.3), rgba(99, 102, 241, 0.3));
            color: #e0e7ff;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: linear-gradient(135deg, #ec4899, #a855f7);
            transform: rotate(90deg);
        }

        .modal-icon {
            width: 65px;
            height: 65px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.5);
        }

        .modal-info {
            margin-bottom: 22px;
        }

        .modal-info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(147, 51, 234, 0.2);
        }

        .modal-info-label {
            color: #a78bfa;
            font-size: 14px;
        }

        .modal-info-value {
            color: #f3e8ff;
            font-size: 14px;
            text-align: right;
            font-weight: 500;
        }

        .modal-window-title {
            font-style: italic;
            color: #c084fc;
        }

        .modal-duration {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(90deg, #f472b6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .chart-select-wrapper {
            position: relative;
            display: inline-block;
        }

        .chart-select {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.4), rgba(99, 102, 241, 0.4)) !important;
            color: #e0e7ff !important;
            border: 1px solid rgba(168, 85, 247, 0.6) !important;
            border-radius: 20px !important;
            padding: 8px 28px 8px 16px !important;
            font-size: 13px !important;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 100%;
        }

        .chart-select-wrapper::after {
            content: '▼';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 10px;
            pointer-events: none;
            font-weight: bold;
        }

        .chart-select:hover {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.6), rgba(99, 102, 241, 0.6)) !important;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .chart-select:focus {
            outline: none;
            border-color: #a855f7 !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5) !important;
        }

        .chart-select option {
            background-color: #1a0a2e !important;
            background: #1a0a2e !important;
            color: #e0e7ff !important;
            padding: 12px 16px !important;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            font-size: 13px;
        }

        .chart-select option:hover {
            background-color: rgba(168, 85, 247, 0.3) !important;
        }

        .chart-title {
            font-size: 15px;
            color: #c084fc;
            font-weight: 600;
        }

        .chart-container {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.8), rgba(22, 33, 62, 0.8));
            border-radius: 16px;
            padding: 18px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(147, 51, 234, 0.2);
        }

        @media (max-width: 768px) {
            .app-item {
                grid-template-columns: auto 1fr;
                gap: 12px;
            }

            .app-time, .app-last-action {
                grid-column: 2;
                text-align: left;
                min-width: auto;
            }

            .time-tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="floating-stars" id="stars"></div>

    <div class="container">
        <header>
            <h1>✨ 应用使用时间追踪</h1>
            <div class="status">
                <span class="status-dot"></span>
                <span>监控中</span>
            </div>
        </header>

        <div class="time-tabs">
            <button class="time-tab active" data-period="today">📅 今日</button>
            <button class="time-tab" data-period="week">📆 本周</button>
            <button class="time-tab" data-period="month">📆 本月</button>
        </div>

        <div id="dateList" class="date-list" style="display: none;"></div>

        <div id="statsSection">
            <div class="stats-card">
                <div class="stat-box">
                    <div class="stat-label">⏰ 总使用时间</div>
                    <div class="stat-value" id="totalTime">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">📱 应用数量</div>
                    <div class="stat-value" id="appCount">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">🕐 最近活动</div>
                    <div class="stat-value" id="lastActivity">--</div>
                </div>
            </div>
        </div>

        <div id="chartSection" style="margin-bottom: 24px;">
            <div class="section-title">📊 时间分布</div>
            <div class="chart-container">
                <canvas id="pieChart" style="max-height: 350px;"></canvas>
            </div>
        </div>

        <div id="detailSection" class="detail-view" style="display: none;">
            <div class="detail-header">
                <span class="detail-date" id="detailDateTitle"></span>
                <button class="back-btn" id="backBtn">← 返回</button>
            </div>
            <div id="detailContent"></div>
        </div>

        <div id="appListSection">
            <div class="section-title">📋 应用列表</div>
            <div class="app-list" id="appList">
                <div class="loading">加载中... 🌟</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="appModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">应用详情</div>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>
        const API_BASE = 'http://127.0.0.1:5000/api';
        let currentPeriod = 'today';
        let currentView = 'list';
        let weekDates = [];
        let monthDates = [];
        let pieChart = null;

        const appIcons = {

            'brave.exe': { icon: '🦊', color: '#fb542b' },

            'opera.exe': { icon: '🔴', color: '#cc0f16' },
            'godot.exe': { icon: '🎮', color: '#478cbf' },
            'twitch.exe': { icon: '🟣', color: '#9146ff' },
            'youtube.exe': { icon: '📺', color: '#ff0000' },
            'netflix.exe': { icon: '🍿', color: '#e50914' },
            'microsoftedge.exe': { icon: '🌐', color: '#0078d7' },
            'Trae CN.exe': { icon: '🤖', color: '#6366f1' },
            'Doubao.exe': { icon: '🤖', color: '#00d4ff' },
            'NVIDIA Overlay.exe': { icon: '🎮', color: '#76b900' },

        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 30; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 15 + 's';
                star.style.width = (Math.random() * 3 + 2) + 'px';
                star.style.height = star.style.width;
                starsContainer.appendChild(star);
            }
        }
        createStars();

        function getAppIcon(appName) {
            const lowerName = appName.toLowerCase();
            for (const [key, value] of Object.entries(appIcons)) {
                if (lowerName.includes(key.toLowerCase())) {
                    return value;
                }
            }
            return { icon: appName.charAt(0).toUpperCase(), color: '#6366f1' };
        }

        function formatDuration(seconds) {
            if (!seconds || seconds < 0) return '0秒';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            if (hours > 0) {
                return `${hours}小时${minutes}分钟`;
            } else if (minutes > 0) {
                return `${minutes}分钟${secs}秒`;
            } else {
                return `${secs}秒`;
            }
        }

        function formatTime(dateStr) {
            if (!dateStr) return '--';
            const date = new Date(dateStr.replace(' ', 'T'));
            return date.toLocaleString('zh-CN', {
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatTimeOnly(dateStr) {
            if (!dateStr) return '--';
            const date = new Date(dateStr.replace(' ', 'T'));
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function renderDateList(dates, dataDates) {
            const dateList = document.getElementById('dateList');
            dateList.innerHTML = dates.map(date => {
                const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                const d = new Date(date.replace(' ', 'T'));
                const dayName = dayNames[d.getDay()];
                const dayNum = d.getDate();
                const hasData = dataDates && dataDates.includes(date);
                return `<button class="date-item${hasData ? ' has-data' : ''}" data-date="${date}">${dayName} ${dayNum}</button>`;
            }).join('');

            dateList.querySelectorAll('.date-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.date-item').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadDateData(btn.dataset.date);
                });
            });
        }

        function getLastAction(app) {
            if (!app.last_close) {
                return { type: 'running', time: formatTimeOnly(app.last_open) };
            }
            if (app.last_close && (!app.last_open || app.last_close > app.last_open)) {
                return { type: 'close', time: formatTimeOnly(app.last_close) };
            }
            return { type: 'open', time: formatTimeOnly(app.last_open) };
        }

        function renderApps(apps) {
            const appList = document.getElementById('appList');
            if (!apps || apps.length === 0) {
                appList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div>暂无数据</div>
                        <div style="font-size:12px;margin-top:8px;">开始使用应用，数据将自动记录 ✨</div>
                    </div>
                `;
                return;
            }

            appList.innerHTML = apps.map((app, index) => {
                const iconInfo = getAppIcon(app.app_name);
                const lastAction = getLastAction(app);
                let actionBadge = '';
                if (lastAction.type === 'running') {
                    actionBadge = `<span class="action-badge running">⏳ 运行中</span>`;
                } else if (lastAction.type === 'close') {
                    actionBadge = `<span class="action-badge close">🔴 ${lastAction.time} 关闭</span>`;
                } else {
                    actionBadge = `<span class="action-badge open">🟢 ${lastAction.time} 打开</span>`;
                }

                return `
                    <div class="app-item" data-index="${index}">
                        <div class="app-icon" style="background: ${iconInfo.color}">${iconInfo.icon}</div>
                        <div class="app-info">
                            <div class="app-name">${app.app_name}</div>
                            <div class="app-window">${app.window_title || ''}</div>
                        </div>
                        <div class="app-time">
                            <div class="app-time-value">${formatDuration(app.total_time)}</div>

                        <div class="app-last-action">${actionBadge}</div>
                    </div>

            appList.querySelectorAll('.app-item').forEach(item => {
                item.addEventListener('click', () => {
                    const index = parseInt(item.dataset.index);
                    showAppDetail(apps[index]);
                });

        let currentAppForHourly = null;
        let hourlyChart = null;

        async function loadChartData(appName, period) {
            try {
                let endpoint, title;
                if (period === 'today') {
                    endpoint = `${API_BASE}/usage/app/${encodeURIComponent(appName)}/today/hourly`;
                    title = '📈 24小时使用分布';
                } else if (period === 'week') {
                    endpoint = `${API_BASE}/usage/app/${encodeURIComponent(appName)}/week/daily`;
                    title = '📊 本周使用分布';
                } else {
                    endpoint = `${API_BASE}/usage/app/${encodeURIComponent(appName)}/month/daily`;
                    title = '📊 本月使用分布';
                }

                console.log('Loading data from:', endpoint);
                const res = await fetch(endpoint);
                const data = await res.json();
                console.log('Received data:', data);
                document.getElementById('chartTitle').textContent = title;
                renderChart(data, period);
            } catch (e) {
                console.error('Error loading chart data:', e);
            }
        }

        function renderChart(data, period) {
            const ctx = document.getElementById('hourlyChart').getContext('2d');

            if (hourlyChart) {
                hourlyChart.destroy();
            }

            let labels, values, yMax, yUnit, yTitle;

            if (period === 'today') {
                labels = [];
                for (let i = 0; i < 24; i++) {
                    labels.push(`${i.toString().padStart(2, '0')}:00`);
                }
                values = data;
                yMax = 60;
                yUnit = '分钟';
                yTitle = '分钟';
            } else if (period === 'week') {
                labels = data.dates.map(d => {
                    const dateStr = d.indexOf(' ') > 0 ? d.substring(0, d.indexOf(' ')) : d;
                    const date = new Date(dateStr + 'T00:00:00');
                    const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                    return dayNames[date.getDay()];
                });
                values = data.values;
                yMax = 24;
                yUnit = '小时';
                yTitle = '小时';
            } else {
                labels = data.dates.map(d => {
                    const dateStr = d.indexOf(' ') > 0 ? d.substring(0, d.indexOf(' ')) : d;
                    const date = new Date(dateStr + 'T00:00:00');
                    return date.getDate().toString();
                });
                values = data.values;
                yMax = 600;
                yUnit = '小时';
                yTitle = '小时';
            }

            const animeColors = [
                '#f472b6', '#a855f7', '#6366f1', '#3b82f6', '#22c55e',
                '#f59e0b', '#ec4899', '#14b8a6', '#8b5cf6', '#f97316'
            ];

            const chartOptions = {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: values.map(v => v > 0 ? '#a855f7' : 'rgba(147, 51, 234, 0.2)'),
                        borderColor: values.map(v => v > 0 ? '#f472b6' : 'rgba(147, 51, 234, 0.3)'),
                        borderWidth: 2,
                        borderRadius: 8,
                        barThickness: 14,
                        maxBarThickness: 18
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: yMax,
                            ticks: {
                                color: '#c084fc',
                                font: { size: 11 },
                                stepSize: period === 'today' ? 15 : (period === 'week' ? 6 : 100),
                                callback: function(value) {
                                    return value + yUnit;
                                }
                            },
                            grid: {
                                color: 'rgba(147, 51, 234, 0.2)'
                            },
                            title: {
                                display: true,
                                text: yTitle,
                                color: '#c084fc',
                                font: { size: 11 }
                            }
                        },
                        x: {
                            ticks: {
                                color: '#a78bfa',
                                font: { size: 10 },
                                maxRotation: 0,
                                callback: function(value, index) {
                                    if (period === 'today') {
                                        if (index % 3 === 0) {
                                            return labels[index];
                                        }
                                        return '';
                                    } else if (period === 'week') {
                                        return labels[index];
                                    } else {
                                        if (labels.length > 15 && index % 2 === 1) {
                                            return '';
                                        }
                                        return labels[index];
                                    }
                                }
                            },
                            grid: {
                                display: false
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(30, 20, 60, 0.95)',
                            titleColor: '#fff',
                            bodyColor: '#e0e7ff',
                            borderColor: 'rgba(168, 85, 247, 0.5)',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                title: function(context) {
                                    return context[0].label;
                                },
                                label: function(context) {
                                    const value = context.raw;
                                    if (value === 0) {
                                        return ' 未使用 ✨';
                                    }
                                    if (period === 'today') {
                                        return ` ${value.toFixed(1)} 分钟`;
                                    } else {
                                        return ` ${value.toFixed(2)} 小时`;
                                    }
                                }
                            }
                        }
                    },
                    animation: {
                        duration: 800,
                        easing: 'easeOutQuart'
                    }
                }
            };

            hourlyChart = new Chart(ctx, chartOptions);
        }

        function renderStats(apps) {
            const totalTime = apps.reduce((sum, app) => sum + (app.total_time || 0), 0);
            document.getElementById('totalTime').textContent = formatDuration(totalTime);
            document.getElementById('appCount').textContent = apps.length;

            const lastOpen = apps.length > 0 && apps[0].last_open
                ? formatTimeOnly(apps[0].last_open)
                : '--';
            document.getElementById('lastActivity').textContent = lastOpen;
        }

        function renderPieChart(apps) {
            const ctx = document.getElementById('pieChart').getContext('2d');

            if (pieChart) {
                pieChart.destroy();
            }

            const totalTime = apps.reduce((sum, app) => sum + (app.total_time || 0), 0);

            if (totalTime === 0) {
                ctx.canvas.parentElement.innerHTML = '<div class="empty-state">暂无数据 🌟</div>';
                return;
            }

            const topApps = apps
                .filter(app => app.total_time > 0)
                .sort((a, b) => b.total_time - a.total_time)
                .slice(0, 8);

            const othersTime = totalTime - topApps.reduce((sum, app) => sum + app.total_time, 0);

            const labels = topApps.map(app => {
                const iconInfo = getAppIcon(app.app_name);
                return `${iconInfo.icon} ${app.app_name.replace('.exe', '')}`;
            });
            const data = topApps.map(app => app.total_time);

            if (othersTime > 0) {
                labels.push('📦 其他');
                data.push(othersTime);
            }

            const animeColors = [
                '#f472b6', '#a855f7', '#6366f1', '#22c55e', '#f59e0b',
                '#ec4899', '#14b8a6', '#8b5cf6', '#f97316', '#06b6d4'
            ];

            pieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: animeColors.slice(0, labels.length),
                        borderWidth: 0,
                        hoverOffset: 25,
                        hoverBorderWidth: 3,
                        hoverBorderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    cutout: '55%',
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#e0e7ff',
                                font: { size: 13, weight: '500' },
                                padding: 14,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(30, 20, 60, 0.95)',
                            titleColor: '#fff',
                            bodyColor: '#e0e7ff',
                            borderColor: 'rgba(168, 85, 247, 0.5)',
                            borderWidth: 1,
                            padding: 14,
                            displayColors: true,
                            callbacks: {
                                label: function(context) {
                                    const value = context.raw;
                                    const percentage = ((value / totalTime) * 100).toFixed(1);
                                    const duration = formatDuration(value);
                                    return ` ${duration} (${percentage}%)`;
                                }
                            }
                        }
                    },
                    animation: {
                        animateScale: true,
                        animateRotate: true,
                        duration: 1000,
                        easing: 'easeOutQuart'
                    }
                }
            });
        }

            if (currentPeriod === 'today') loadTodayData();
            else if (currentPeriod === 'week') loadWeekData();
            else if (currentPeriod === 'month') loadMonthData();
        }

        document.querySelectorAll('.time-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentPeriod = tab.dataset.period;
                currentView = 'list';
                document.getElementById('dateList').style.display = 'none';
                document.getElementById('detailSection').style.display = 'none';
                document.getElementById('chartSection').style.display = 'block';
                document.getElementById('statsSection').style.display = 'block';
                document.getElementById('appListSection').style.display = 'block';

                document.querySelectorAll('.time-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                if (currentPeriod === 'today') loadTodayData();
                else if (currentPeriod === 'week') {
                    document.getElementById('dateList').style.display = 'flex';
                    loadWeekData();
                }
                else if (currentPeriod === 'month') {
                    document.getElementById('dateList').style.display = 'flex';
                    loadMonthData();
                }
            });
        });

        document.getElementById('backBtn').addEventListener('click', showMainView);

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('appModal').classList.remove('show');
        });

        document.getElementById('appModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('appModal')) {
                document.getElementById('appModal').classList.remove('show');
            }
        });

        loadTodayData();
        setInterval(() => {
            if (currentPeriod === 'today' && currentView === 'list') {
                loadTodayData();
            }
        }, 5000);
    </script>
</body>
</html>
